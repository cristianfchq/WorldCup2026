<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pronósticos Mundial 2026</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/animations.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <h1 class="app-header__title">⚽ Pronósticos Mundial 2026</h1>
      <div class="app-header__controls">
        <span id="current-participant-label" class="current-participant" hidden></span>
        <button id="refresh-data-btn" class="btn" type="button" hidden>🔄 Actualizar</button>
        <button id="change-participant-btn" class="btn" type="button" hidden>Cambiar</button>
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="Cambiar tema">🌙</button>
      </div>
    </header>

    <!-- Paso 1: elegir quién eres. Se salta automáticamente si ya está
         guardado en este navegador (ver StorageUtils / app.js). -->
    <section id="name-gate" class="gate-card">
      <h2>¿Quién eres?</h2>
      <p>Elige tu nombre para empezar a pronosticar.</p>
      <select id="gate-select" class="select-participant">
        <option value="" disabled selected>Selecciona tu nombre</option>
      </select>
      <button id="gate-enter-btn" class="btn btn--primary" type="button" disabled>Ingresar</button>
    </section>

    <!-- Paso 2: pronósticos. Oculto hasta elegir un nombre. -->
    <div id="main-content" hidden>
      <nav id="phase-tabs" class="phase-tabs"></nav>
      <nav id="date-tabs" class="date-tabs"></nav>

      <main id="match-list"></main>

      <section class="admin-section">
        <h2>Tabla de posiciones</h2>
        <div id="leaderboard"></div>
      </section>

      <section class="admin-section">
        <h2>Mis apuestas</h2>
        <div id="participant-history"></div>
      </section>

      <section class="admin-section">
        <h2>Mis deudas</h2>
        <div id="participant-debts"></div>
      </section>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
